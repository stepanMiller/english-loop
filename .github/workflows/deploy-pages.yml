name: Deploy English Loop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble EnglishLoop source
        run: cat src/EnglishLoop.part-*.txt > src/EnglishLoop.tsx
      - name: Add automatic homework generation demo
        run: python3 scripts/patch_demo.py
      - name: Add tutor instructions to generation
        run: python3 scripts/patch_tutor_instructions.py
      - name: Add homework preview refinement
        run: python3 scripts/patch_preview_refinement.py
      - name: Fix and validate preview runtime state
        run: python3 scripts/patch_preview_fix.py
      - name: Add real Vocabulary voice input
        run: python3 scripts/patch_recall_voice.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
